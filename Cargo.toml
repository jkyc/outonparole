[package]
name = "outonparole"
version = "0.1.0"
edition = "2021"
description = "Out on Parole: small open-world crime game (Rust + macroquad rewrite, native and WebAssembly)"

[dependencies]
macroquad = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 2
