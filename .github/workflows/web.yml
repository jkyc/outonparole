name: Build web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Assemble site
        run: |
          mkdir -p dist-web
          cp target/wasm32-unknown-unknown/release/outonparole.wasm dist-web/
          cp web/index.html dist-web/
          curl -fL -o dist-web/mq_js_bundle.js https://raw.githubusercontent.com/not-fl3/macroquad/master/js/mq_js_bundle.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
